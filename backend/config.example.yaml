server:
  port: 8000
  mode: dev

database:
  host: localhost
  port: 5432
  user: postgres
  password: your_db_password
  dbname: sheet_platform_optimize

redis:
  addr: localhost:6379
  password: ""
  db: 0

jwt:
  secret: "${JWT_SECRET}"
  ttl: 24h

alipay:
  app_id: "your_alipay_app_id"
  app_private_key: "your_app_private_key"
  alipay_public_key: "your_alipay_public_key"
  notify_url: "https://your-domain.com/api/alipay/notify"
  return_url: "https://your-domain.com/sheet-music/{id}"
  sign_type: "RSA2"
  charset: "utf-8"
  gateway_url: "https://openapi.alipay.com/gateway.do"
  sandbox: true

email:
  host: smtp.example.com
  port: 465
  username: your_email@example.com
  password: your_email_password

upload:
  dir: ./uploads
  max_size: 50
